colorScheme = "nsw"
defaultAppearance = "light" # valid options: light or dark
autoSwitchAppearance = true

enableSearch = false
enableCodeCopy = true

fingerprintAlgorithm = "sha512"

[header]
  layout = "fixed-fill-blur" # valid options: basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur, floating

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "landing" # valid options: page, profile, hero, card, background, landing, custom
  showRecent = false
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = "/posts/"

[article]
  showDate = true
  showAuthor = false
  showBreadcrumbs = true
  showHeadingAnchors = true
  showPagination = false
  showReadingTime = false
  showWordCount = false
  showTableOfContents = false
  showTaxonomies = false

[list]
  showBreadcrumbs = true
  showSummary = true
  groupByYear = true
